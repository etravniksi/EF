<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111">
<title>Premerka – AUTO</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; font-family:-apple-system,Roboto,sans-serif;
    background:#111; color:#eee; overflow-x:hidden; touch-action:manipulation; }
  body { display:flex; flex-direction:column; align-items:center; padding:8px 4px 20px; }
  .camera-wrap { position:relative; width:90vw; max-width:560px; aspect-ratio:4/3;
    background:#000; border:2px solid #333; border-radius:12px;
    overflow:hidden; margin-bottom:10px; }
  #v { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; }
  #overlay { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:2; }
  #process { display:none; }
  .controls { width:100vw; max-width:640px; display:flex; flex-direction:column; gap:10px; padding:0 12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button { padding:14px 18px; font-size:clamp(15px,4vw,20px); border:none; border-radius:12px;
    background:#4f4; color:#111; font-weight:bold; box-shadow:0 4px 0 #2a2; flex:1;
    min-height:52px; white-space:nowrap; }
  button:active { transform:translateY(3px); box-shadow:0 2px 0 #2a2; }
  button.alt { background:#48f; color:#fff; box-shadow:0 4px 0 #25a; }
  button.export { background:#f90; color:#111; box-shadow:0 4px 0 #a60; }
  button.small { flex:0 0 auto; min-width:auto; padding:10px 16px; font-size:14px; }
  select { flex:1; min-width:120px; padding:12px 14px; font-size:15px;
    background:#222; color:#eee; border:2px solid #444; border-radius:10px; -webkit-appearance:none; }
  input[type=range] { -webkit-appearance:none; appearance:none; flex:1; min-width:100px;
    height:60px; background:transparent; margin:0; touch-action:none; }
  input[type=range]::-webkit-slider-runnable-track { height:20px; background:#333;
    border-radius:10px; border:2px solid #555; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; appearance:none;
    width:30px; height:30px; background:#48f; border:3px solid #fff;
    border-radius:50%; margin-top:-8px; }
  input[type=range]:disabled::-webkit-slider-thumb { background:#666; }
  #rezultat { font-size:clamp(34px,10vw,56px); font-weight:bold; color:#4f4; }
  #totalVal, .big { font-size:clamp(26px,7vw,44px); font-weight:bold; color:#4f4; }
  .val { font-size:clamp(16px,4.5vw,26px); font-weight:bold; color:#4f4; }
  .label { font-size:clamp(14px,4vw,20px); color:#bbb; font-weight:bold; min-width:90px; flex-shrink:0; }
  #status { font-size:clamp(12px,3.3vw,16px); color:#888; margin-left:auto; }
  .warn { color:#fa0; font-weight:bold; font-size:clamp(14px,4vw,20px); }
  #testOut { font-family:ui-monospace,monospace; font-size:clamp(10px,2.7vw,13px);
    color:#8f8; white-space:pre; max-height:45vh; overflow:auto; background:#000;
    padding:10px; border-radius:10px; line-height:1.35; width:100%; }
  .debug-toggle { display:flex; align-items:center; gap:8px; font-size:15px; color:#bbb; }
  input[type=checkbox] { width:22px; height:22px; }
</style>
</head>
<body>

<div class="camera-wrap">
  <video id="v" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>
<canvas id="process"></canvas>

<div class="controls">
  <div class="row"><span class="label">Kamera</span><select id="camSelect"></select></div>

  <div class="row">
    <button id="orientBtn" class="small">Vodoravno</button>
    <button id="exportBtn" class="export">Izvozi A4 (JPG)</button>
  </div>

  <div class="row">
    <button id="toggle">Na simulator</button>
    <button id="testBtn" class="alt">Preveri</button>
  </div>

  <div class="row">
    <label class="debug-toggle" style="font-size:18px;color:#4f4;">
      <input type="checkbox" id="autoChk" checked>
      AVTOMATIKA (vse samodejno)
    </label>
  </div>

  <div class="row">
    <span class="label">Debelina</span>
    <input type="range" id="lineThick" min="1" max="12" step="1" value="4">
    <span id="lineThickVal" class="val">4 px</span>
  </div>

  <div class="row">
    <span class="label">Velikost</span>
    <input type="range" id="roiSize" min="10" max="80" step="1" value="35" disabled>
    <span id="roiSizeVal" class="val">35 %</span>
  </div>
  <div class="row">
    <span class="label">Pomik</span>
    <input type="range" id="roiOffset" min="0" max="100" step="1" value="50" disabled>
    <span id="roiOffsetVal" class="val">50 %</span>
  </div>

  <div class="row">
    <span class="label">Threshold</span>
    <input type="range" id="thSlider" min="0" max="255" step="1" value="128" disabled>
    <span id="thVal" class="val">128</span>
  </div>
  <div class="row">
    <span class="label">Offset</span>
    <input type="range" id="thOffset" min="-60" max="60" step="1" value="0">
    <span id="thOffsetVal" class="val">0</span>
  </div>

  <div class="row">
    <label class="debug-toggle">
      <input type="checkbox" id="contrastChk" checked>
      Prikaz kontrasta
    </label>
    <label class="debug-toggle">
      <input type="checkbox" id="debugChk" checked>
      Debug prikaz
    </label>
  </div>

  <div class="row">
    <span class="label">Grobo</span>
    <input type="range" id="coarse" min="0" max="1000" step="5" value="0">
    <span id="coarseVal" class="val">0 mm</span>
  </div>
  <div class="row">
    <span class="label">Fino</span>
    <input type="range" id="fine" min="-30" max="30" step="0.01" value="0">
    <span id="fineVal" class="val">0.00</span>
  </div>
  <div class="row"><span class="label">P</span>
    <span id="totalVal" class="val big">0.00 mm</span></div>
  <div class="row"><span class="label">Prebrano</span>
    <span id="rezultat">–</span></div>
  <div class="row"><span class="label">Napaka</span>
    <span id="napakaVal" class="val">–</span></div>
  <div class="row"><span class="label">δ</span>
    <span id="deltaVal" class="val">–</span>
    <span id="boundaryWarn" class="warn"></span></div>
  <div class="row"><span id="status">Kamera</span></div>
  <div id="testOut"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const CODE_OFFSET = 100;
const P_MIN_MM = 0, P_MAX_MM = 1000;
const DRAW_MIN_MM = 70, DRAW_MAX_MM = 1130;

function deBruijn(k, n) {
  const a = new Array(n+1).fill(0), seq = [];
  (function db(t,p){
    if (t>n){ if(n%p===0) for(let i=1;i<=p;i++) seq.push(a[i]); }
    else { a[t]=a[t-p]; db(t+1,p);
      for(let j=a[t-p]+1;j<k;j++){ a[t]=j; db(t+1,t); } }
  })(1,1);
  return seq;
}
const DB = deBruijn(2,8);
const LOOKUP = new Array(256).fill(-1);
for (let i = 0; i < 256; i++) {
  let w = 0;
  for (let j = 0; j < 8; j++) w |= DB[(i+j) & 0xFF] << j;
  LOOKUP[w] = i;
}

const video    = $('v');
const overlay  = $('overlay');
const ovctx    = overlay.getContext('2d');
const processC = $('process');
const pctx     = processC.getContext('2d', { willReadFrequently:true });
const outEl    = $('rezultat');
const statusEl = $('status');

const PX_PER_MM = 10, IDEAL_CELL_PX = 50, ROW_PX = 50, Y0 = 50;
const Y_ROW0 = Y0, Y_ROW1 = Y0+ROW_PX, Y_ROW2 = Y0+2*ROW_PX;
const yC0 = Y_ROW0+25, yC1 = Y_ROW1+25, yC2 = Y_ROW2+25;

let mode = 'camera';
let orientation = 'h';
let stream = null, currentDeviceId = null;
let roiSize = 0.35, roiOffset = 0.50;
let lineThick = 4;
let debugOn = true;
let contrastOn = true;
let autoMode = true;   // master switch
let manualTh = 128;
let thOffset = 0;

function drawSimulator(P) {
  const Pphys = P + CODE_OFFSET;
  const W = processC.width, H = processC.height, cx = W/2;
  const c0 = Math.floor(Pphys/5);
  const cMin = Math.floor(DRAW_MIN_MM/5), cMax = Math.ceil(DRAW_MAX_MM/5);
  pctx.fillStyle = 'white'; pctx.fillRect(0,0,W,H);
  const xOf = col => Math.round(cx + (col*5 - Pphys) * PX_PER_MM);
  for (let col = c0-20; col <= c0+24; col++) {
    if (col < cMin || col > cMax) continue;
    const x = xOf(col), w = ROW_PX;
    pctx.fillStyle = DB[col & 0xFF] ? 'black' : 'white';
    pctx.fillRect(x, Y_ROW0, w, ROW_PX);
    pctx.fillStyle = DB[(col+4) & 0xFF] ? 'black' : 'white';
    pctx.fillRect(x, Y_ROW1, w, ROW_PX);
    pctx.fillStyle = (col & 1) ? 'white' : 'black';
    pctx.fillRect(x, Y_ROW2, w, ROW_PX);
  }
}

function readPixel(x, y) {
  const xi = Math.round(x), yi = Math.round(y);
  if (xi<0 || yi<0 || xi>=processC.width || yi>=processC.height) return 1;
  const d = pctx.getImageData(xi, yi, 1, 1).data;
  return ((d[0]+d[1]+d[2])/3) < 128 ? 1 : 0;
}
function readBrightness(x, y) {
  const xi = Math.round(x), yi = Math.round(y);
  if (xi<0 || yi<0 || xi>=processC.width || yi>=processC.height) return 255;
  const d = pctx.getImageData(xi, yi, 1, 1).data;
  return (d[0]+d[1]+d[2])/3;
}

// Otsu threshold
function otsuThreshold(yc, W, H, halfBand) {
  halfBand = halfBand || 3;
  if (yc < 0 || yc >= H) return 128;
  const hist = new Array(256).fill(0);
  const yStart = Math.max(0, Math.floor(yc) - halfBand);
  const yEnd = Math.min(H, Math.floor(yc) + halfBand + 1);
  let total = 0;
  for (let y = yStart; y < yEnd; y++)
    for (let x = 2; x < W-2; x++) {
      const v = Math.round(readBrightness(x, y));
      hist[Math.min(255, Math.max(0, v))]++;
      total++;
    }
  if (total === 0) return 128;
  let sum = 0;
  for (let i = 0; i < 256; i++) sum += i * hist[i];
  let sumB = 0, wB = 0, max = 0, threshold = 128;
  for (let t = 0; t < 256; t++) {
    wB += hist[t];
    if (wB === 0) continue;
    const wF = total - wB;
    if (wF === 0) break;
    sumB += t * hist[t];
    const mB = sumB / wB;
    const mF = (sum - sumB) / wF;
    const between = wB * wF * (mB - mF) * (mB - mF);
    if (between > max) { max = between; threshold = t; }
  }
  return threshold;
}

// Preštej prehode v vodoravni črti
function countTransitions(y, thresh, W) {
  let count = 0;
  let prev = readBrightness(0, y) < thresh ? 1 : 0;
  for (let x = 1; x < W; x++) {
    const v = readBrightness(x, y) < thresh ? 1 : 0;
    if (v !== prev) count++;
    prev = v;
  }
  return count;
}

// Povprečna svetlost v pasu
function avgBrightness(yc, halfBand, W, H) {
  let sum = 0, n = 0;
  const yStart = Math.max(0, yc - halfBand);
  const yEnd = Math.min(H, yc + halfBand + 1);
  for (let y = yStart; y < yEnd; y++)
    for (let x = 2; x < W-2; x += 2) {
      sum += readBrightness(x, y);
      n++;
    }
  return n > 0 ? sum / n : 255;
}

// Simulator branje
function readBitSim(yc, xC) {
  let s=0,n=0;
  for (const dx of [-8,-4,4,8]) { s += readPixel(xC+dx, yc); n++; }
  return s > n/2 ? 1 : 0;
}
function readWindowAt(Pphys, cStart) {
  const cx = processC.width/2; let bits = 0;
  for (let i=0;i<4;i++) {
    const xc = cx + ((cStart+i)*5 + 2.5 - Pphys) * PX_PER_MM;
    bits |= readBitSim(yC0, xc) << i;
    bits |= readBitSim(yC1, xc) << (4+i);
  }
  return { bits, c: LOOKUP[bits] };
}
function findCellEdgesSim(xC, yc) {
  const col = readPixel(xC, yc);
  let L=null, R=null;
  for (let d=1;d<80;d++) if (readPixel(xC-d,yc)!==col){L=xC-d+0.5;break;}
  for (let d=1;d<80;d++) if (readPixel(xC+d,yc)!==col){R=xC+d-0.5;break;}
  return { L, R };
}
function readDynamic(P) {
  const Pphys = P + CODE_OFFSET;
  const cx = processC.width/2;
  const N = Math.min(Math.floor((processC.width - 100)/50), 15);
  const halfN = Math.floor(N/2);
  const cApprox = Math.floor(Pphys/5);
  const wins = [];
  for (let k=0;k<N-3;k++) {
    const cs = cApprox - halfN + k;
    wins.push({ k, cs, ...readWindowAt(Pphys, cs) });
  }
  let bestS=0,bestL=0,curS=0;
  for (let k=0;k<wins.length;k++) {
    const prev = wins[k-1], w = wins[k];
    const cons = k>0 && prev.c>=0 && w.c>=0 && ((w.c-prev.c+256)%256===1);
    if (!cons) { if (k-curS>bestL){bestL=k-curS;bestS=curS;} curS=k; }
  }
  if (wins.length-curS>bestL) { bestL = wins.length-curS; bestS = curS; }
  const targetK = halfN-2;
  let chosen=null,bd=Infinity;
  if (bestL>=3) for (let k=bestS;k<bestS+bestL;k++) {
    if (wins[k].c<0) continue;
    const d = Math.abs(k-targetK);
    if (d<bd){bd=d;chosen=wins[k];}
  }
  if (!chosen) for (const w of wins) {
    if (w.c<0) continue;
    const d = Math.abs(w.k-targetK);
    if (d<bd){bd=d;chosen=w;}
  }
  if (!chosen) chosen = { k:targetK, cs:cApprox, c:cApprox, bits:0 };
  const cStart = chosen.c;
  const offset = Math.max(0, Math.min(7, cApprox-cStart));
  const cRef = cStart + offset;
  const xc = cx + (cRef*5 + 2.5 - Pphys) * PX_PER_MM;
  const e = findCellEdgesSim(xc, yC2);
  let delta=0, w=null, cal=1;
  if (e.L!==null && e.R!==null) {
    w = e.R-e.L; cal = w/IDEAL_CELL_PX;
    delta = Math.max(0, Math.min(5, (cx-e.L)/w*5));
  }
  const mm_phys = cRef*5 + delta, mm = mm_phys - CODE_OFFSET;
  const bitPoints = [];
  for (let i=0;i<4;i++) {
    const xc2 = cx + ((cStart+i)*5+2.5 - Pphys)*PX_PER_MM;
    bitPoints.push({ x:xc2, y:yC0, bit:i });
    bitPoints.push({ x:xc2, y:yC1, bit:i+4 });
  }
  return {
    c:cRef, cStart, cRef, offset, bits:chosen.bits, cApprox,
    chosenK:chosen.k, bestLen:bestL, bestStart:bestS,
    numWindows:wins.length, validWindows:wins.filter(x=>x.c>=0).length,
    allC:wins.map(x=>x.c), delta, widthPx:w, calFactor:cal,
    mm, mm_phys, bitPoints, refLeft:e.L, refRight:e.R,
    gridLines:[], yRow0:yC0, yRow1:yC1, yRow2:yC2,
    thresholds:{ th0:128, th1:128, th2:128 },
    rowH: ROW_PX, detected:false
  };
}

// ============================================================
// AVTOMATSKO BRANJE IZ KAMERE
// ============================================================
function readFromCamera() {
  const W = processC.width, H = processC.height, cx = Math.floor(W/2);

  // Global threshold (Otsu na celotni sliki)
  const globalTh = otsuThreshold(H/2, W, H, H/2);

  // ---- 1) Najdi CLOCK vrstico: y z največ prehodi ----
  let bestY = -1, bestT = 0;
  const scanStart = 4, scanEnd = H - 4;
  for (let y = scanStart; y < scanEnd; y++) {
    const t = countTransitions(y, globalTh, W);
    if (t > bestT) { bestT = t; bestY = y; }
  }
  if (bestY < 0 || bestT < 6) {
    return { ok:false, reason:'CLOCK ni najden (bestT='+bestT+')',
             thresholds:{th0:globalTh, th1:globalTh, th2:globalTh},
             yRow0:0, yRow1:0, yRow2:0, rowH:0, detected:false };
  }

  // Zgladi bestY: poišči težišče vrhov v oknu ±5
  let sumW = 0, sumYW = 0;
  for (let y = Math.max(0, bestY-5); y <= Math.min(H-1, bestY+5); y++) {
    const t = countTransitions(y, globalTh, W);
    sumW += t; sumYW += y * t;
  }
  const yRow2 = Math.round(sumYW / sumW);

  // ---- 2) Preberi prehode v CLOCK in izračunaj širino celice ----
  const clockTrans = [];
  let prev = readBrightness(0, yRow2) < globalTh ? 1 : 0;
  for (let x = 1; x < W; x++) {
    const v = readBrightness(x, yRow2) < globalTh ? 1 : 0;
    if (v !== prev) clockTrans.push(x);
    prev = v;
  }
  if (clockTrans.length < 4) {
    return { ok:false, reason:'Premalo CLOCK prehodov',
             thresholds:{th0:globalTh, th1:globalTh, th2:globalTh},
             yRow0:0, yRow1:0, yRow2, rowH:0, detected:false };
  }
  const rawGaps = [];
  for (let i = 1; i < clockTrans.length; i++) rawGaps.push(clockTrans[i]-clockTrans[i-1]);
  const sortedGaps = [...rawGaps].sort((a,b)=>a-b);
  const cellPx = sortedGaps[Math.floor(sortedGaps.length/2)];
  if (cellPx < 4) {
    return { ok:false, reason:'Premajhen cikel ('+cellPx+')',
             thresholds:{th0:globalTh, th1:globalTh, th2:globalTh},
             yRow0:0, yRow1:0, yRow2, rowH:0, detected:false };
  }

  // ---- 3) Row height = cellPx (kvadratne celice 5×5 mm) ----
  // Poišči yRow1 in yRow0 tako, da gremo navzgor za cellPx
  let yRow1 = Math.round(yRow2 - cellPx);
  let yRow0 = Math.round(yRow2 - 2*cellPx);

  // Robna varnost
  if (yRow0 < 2) yRow0 = 2;
  if (yRow1 < 2) yRow1 = 2;

  // ---- 4) Threshold za vsako vrstico (Otsu) + offset ----
  let th0 = otsuThreshold(yRow0, W, H, 3);
  let th1 = otsuThreshold(yRow1, W, H, 3);
  let th2 = otsuThreshold(yRow2, W, H, 3);
  th0 = Math.max(0, Math.min(255, th0 + thOffset));
  th1 = Math.max(0, Math.min(255, th1 + thOffset));
  th2 = Math.max(0, Math.min(255, th2 + thOffset));

  // ---- 5) Filtriraj prehode CLOCK ----
  const good = [clockTrans[0]];
  for (let i = 1; i < clockTrans.length; i++) {
    const g = clockTrans[i] - good[good.length-1];
    if (g >= cellPx*0.5 && g <= cellPx*1.6) good.push(clockTrans[i]);
    else if (g > cellPx*1.6) good.push(clockTrans[i]);
  }
  if (good.length < 5) {
    return { ok:false, reason:'Premalo veljavnih celic',
             thresholds:{th0,th1,th2}, yRow0, yRow1, yRow2,
             rowH: cellPx, detected:true, detectedTrans: bestT };
  }
  const numCells = good.length - 1;

  // ---- 6) Preberi celice z glasovanjem ----
  const cellCenters = [], upper = [], lower = [];
  for (let i = 0; i < numCells; i++) {
    const xc = Math.round((good[i] + good[i+1]) / 2);
    cellCenters.push(xc);
    let v0=0, v1=0, nn=0;
    for (const dx of [-8,-4,0,4,8]) {
      if (xc+dx < 1 || xc+dx > W-1) continue;
      v0 += readBrightness(xc+dx, yRow0) < th0 ? 1 : 0;
      v1 += readBrightness(xc+dx, yRow1) < th1 ? 1 : 0;
      nn++;
    }
    upper.push(v0 > nn/2 ? 1 : 0);
    lower.push(v1 > nn/2 ? 1 : 0);
  }

  // ---- 7) Vsa 8-bitna okna ----
  const cands = [];
  for (let i = 0; i <= numCells-4; i++) {
    let bits = 0;
    for (let k = 0; k < 4; k++) {
      bits |= upper[i+k] << k;
      bits |= lower[i+k] << (4+k);
    }
    cands.push({ i, bits, c: LOOKUP[bits] });
  }
  if (cands.length === 0) {
    return { ok:false, reason:'Ni kandidatov',
             thresholds:{th0,th1,th2}, yRow0, yRow1, yRow2,
             rowH: cellPx, detected:true, detectedTrans: bestT };
  }

  let bestS=0, bestL=0, curS=0;
  for (let k = 0; k < cands.length; k++) {
    const p = cands[k-1], w = cands[k];
    const cons = k>0 && p.c>=0 && w.c>=0 && ((w.c-p.c+256)%256===1);
    if (!cons) { if (k-curS>bestL){bestL=k-curS;bestS=curS;} curS=k; }
  }
  if (cands.length-curS>bestL) { bestL = cands.length-curS; bestS = curS; }
  if (bestL < 1) {
    return { ok:false, reason:'Ni niza',
             thresholds:{th0,th1,th2}, yRow0, yRow1, yRow2,
             rowH: cellPx, detected:true, detectedTrans: bestT };
  }

  let cellAtCx = -1;
  for (let i = 0; i < numCells; i++) {
    if (good[i] <= cx && cx < good[i+1]) { cellAtCx = i; break; }
  }
  if (cellAtCx < 0) cellAtCx = Math.floor(numCells/2);

  let chosen = null, chosenCRef = null;
  for (let k = bestS; k < bestS+bestL; k++) {
    const cand = cands[k];
    if (cand.c < 0) continue;
    if (cellAtCx >= cand.i && cellAtCx <= cand.i+3) {
      chosen = cand;
      chosenCRef = cand.c + (cellAtCx - cand.i);
      break;
    }
  }
  if (!chosen) {
    let bd = Infinity;
    for (let k = bestS; k < bestS+bestL; k++) {
      const cand = cands[k];
      if (cand.c < 0) continue;
      const d = Math.abs(cand.i - cellAtCx);
      if (d < bd) { bd = d; chosen = cand; chosenCRef = cand.c + (cellAtCx - cand.i); }
    }
  }
  if (!chosen) {
    return { ok:false, reason:'Ni okna',
             thresholds:{th0,th1,th2}, yRow0, yRow1, yRow2,
             rowH: cellPx, detected:true, detectedTrans: bestT };
  }

  const cRef = chosenCRef;
  const refLeft  = good[cellAtCx];
  const refRight = good[cellAtCx+1];
  const refW = refRight - refLeft;
  let delta = (cx - refLeft) / refW * 5;
  delta = Math.max(0, Math.min(5, delta));

  const mm_phys = cRef * 5 + delta;
  const mm = Math.max(0, Math.min(1000, mm_phys - CODE_OFFSET));

  const bitPoints = [];
  for (let k = 0; k < 4; k++) {
    const gi = chosen.i + k;
    if (gi < 0 || gi >= numCells) continue;
    bitPoints.push({ x: cellCenters[gi], y: yRow0, bit: k });
    bitPoints.push({ x: cellCenters[gi], y: yRow1, bit: k+4 });
  }

  return {
    ok:true, mm, mm_phys, c:cRef, delta,
    cellPx, cellW: refW,
    bits: chosen.bits,
    bitPoints,
    gridLines: good,
    refLeft, refRight,
    yRow0, yRow1, yRow2, rowH: cellPx,
    cellAtCx, chosenI: chosen.i, bestLen: bestL, bestStart: bestS,
    numCells, transitions: good,
    cands, thresholds: { th0, th1, th2 },
    detected:true, detectedTrans: bestT
  };
}

// Ročni način (uporablja ROI sliders)
function readFromCameraManual() {
  const W = processC.width, H = processC.height, cx = Math.floor(W/2);
  const roiPx = Math.max(20, H * roiSize);
  const y0 = H * roiOffset - roiPx/2;
  const rowPx = roiPx/3;
  const yRow0 = Math.round(y0 + rowPx*0.5);
  const yRow1 = Math.round(y0 + rowPx*1.5);
  const yRow2 = Math.round(y0 + rowPx*2.5);

  let th0 = manualTh, th1 = manualTh, th2 = manualTh;
  th0 = Math.max(0, Math.min(255, th0 + thOffset));
  th1 = Math.max(0, Math.min(255, th1 + thOffset));
  th2 = Math.max(0, Math.min(255, th2 + thOffset));

  const thresh2 = th2;
  const transitions = [];
  let prev = readBrightness(0, yRow2) < thresh2 ? 1 : 0;
  for (let x = 1; x < W; x++) {
    const v = readBrightness(x, yRow2) < thresh2 ? 1 : 0;
    if (v !== prev) transitions.push(x);
    prev = v;
  }
  if (transitions.length < 6) {
    return { ok:false, reason:'Premalo prehodov',
             thresholds:{th0,th1,th2}, yRow0, yRow1, yRow2,
             rowH: rowPx, detected:false };
  }
  const rawGaps = [];
  for (let i = 1; i < transitions.length; i++) rawGaps.push(transitions[i]-transitions[i-1]);
  const sortedGaps = [...rawGaps].sort((a,b)=>a-b);
  const medGap = sortedGaps[Math.floor(sortedGaps.length/2)];

  const good = [transitions[0]];
  for (let i = 1; i < transitions.length; i++) {
    const g = transitions[i] - good[good.length-1];
    if (g >= medGap*0.5 && g <= medGap*1.6) good.push(transitions[i]);
    else if (g > medGap*1.6) good.push(transitions[i]);
  }
  if (good.length < 5) {
    return { ok:false, reason:'Premalo celic',
             thresholds:{th0,th1,th2}, yRow0, yRow1, yRow2,
             rowH: rowPx, detected:false };
  }
  const numCells = good.length - 1;
  const cellCenters = [], upper = [], lower = [];
  for (let i = 0; i < numCells; i++) {
    const xc = Math.round((good[i] + good[i+1]) / 2);
    cellCenters.push(xc);
    let v0=0, v1=0, nn=0;
    for (const dx of [-8,-4,0,4,8]) {
      if (xc+dx < 1 || xc+dx > W-1) continue;
      v0 += readBrightness(xc+dx, yRow0) < th0 ? 1 : 0;
      v1 += readBrightness(xc+dx, yRow1) < th1 ? 1 : 0;
      nn++;
    }
    upper.push(v0 > nn/2 ? 1 : 0);
    lower.push(v1 > nn/2 ? 1 : 0);
  }
  const cands = [];
  for (let i = 0; i <= numCells-4; i++) {
    let bits = 0;
    for (let k = 0; k < 4; k++) {
      bits |= upper[i+k] << k;
      bits |= lower[i+k] << (4+k);
    }
    cands.push({ i, bits, c: LOOKUP[bits] });
  }
  let bestS=0, bestL=0, curS=0;
  for (let k = 0; k < cands.length; k++) {
    const p = cands[k-1], w = cands[k];
    const cons = k>0 && p.c>=0 && w.c>=0 && ((w.c-p.c+256)%256===1);
    if (!cons) { if (k-curS>bestL){bestL=k-curS;bestS=curS;} curS=k; }
  }
  if (cands.length-curS>bestL) { bestL = cands.length-curS; bestS = curS; }
  let cellAtCx = -1;
  for (let i = 0; i < numCells; i++) {
    if (good[i] <= cx && cx < good[i+1]) { cellAtCx = i; break; }
  }
  if (cellAtCx < 0) cellAtCx = Math.floor(numCells/2);
  let chosen=null, chosenCRef=null;
  for (let k=bestS;k<bestS+bestL;k++) {
    const cand = cands[k];
    if (cand.c<0) continue;
    if (cellAtCx >= cand.i && cellAtCx <= cand.i+3) {
      chosen = cand; chosenCRef = cand.c + (cellAtCx - cand.i); break;
    }
  }
  if (!chosen) {
    let bd = Infinity;
    for (let k=bestS;k<bestS+bestL;k++) {
      const cand = cands[k];
      if (cand.c<0) continue;
      const d = Math.abs(cand.i - cellAtCx);
      if (d < bd) { bd = d; chosen = cand; chosenCRef = cand.c + (cellAtCx - cand.i); }
    }
  }
  if (!chosen) return { ok:false, reason:'Ni okna',
    thresholds:{th0,th1,th2}, yRow0, yRow1, yRow2, rowH: rowPx, detected:false };
  const cRef = chosenCRef;
  const refLeft = good[cellAtCx], refRight = good[cellAtCx+1];
  const refW = refRight - refLeft;
  let delta = (cx - refLeft) / refW * 5;
  delta = Math.max(0, Math.min(5, delta));
  const mm_phys = cRef * 5 + delta;
  const mm = Math.max(0, Math.min(1000, mm_phys - CODE_OFFSET));
  const bitPoints = [];
  for (let k = 0; k < 4; k++) {
    const gi = chosen.i + k;
    if (gi < 0 || gi >= numCells) continue;
    bitPoints.push({ x: cellCenters[gi], y: yRow0, bit: k });
    bitPoints.push({ x: cellCenters[gi], y: yRow1, bit: k+4 });
  }
  return { ok:true, mm, mm_phys, c:cRef, delta, cellPx: medGap, cellW: refW,
    bits: chosen.bits, bitPoints, gridLines: good, refLeft, refRight,
    yRow0, yRow1, yRow2, rowH: rowPx,
    cellAtCx, chosenI: chosen.i, bestLen: bestL, bestStart: bestS,
    numCells, transitions: good, cands, thresholds:{th0,th1,th2},
    detected:false };
}

function snapshotToProcess() {
  if (video.readyState < 2) return;
  const W = processC.width, H = processC.height;
  pctx.save();
  if (orientation === 'h') {
    pctx.drawImage(video, 0, 0, W, H);
  } else {
    pctx.translate(W/2, H/2);
    pctx.rotate(Math.PI/2);
    const ratio = video.videoWidth / video.videoHeight;
    let dw = H, dh = H/ratio;
    if (dh < W) { dh = W; dw = W*ratio; }
    pctx.drawImage(video, -dw/2, -dh/2, dw, dh);
  }
  pctx.restore();
}

function drawGuidesOnOverlay(debug) {
  const W = overlay.width, H = overlay.height;
  ovctx.clearRect(0,0,W,H);

  // KONTRAST – tanki pasovi okoli vrstic
  if (contrastOn && debug && debug.thresholds && debug.yRow0 !== undefined
      && debug.yRow2 > 0) {
    const th = debug.thresholds;
    const yR0 = debug.yRow0, yR1 = debug.yRow1, yR2 = debug.yRow2;
    const bandH = Math.max(4, Math.round(debug.rowH * 0.5));

    for (let x = 4; x < W-4; x += 3) {
      const v0 = readBrightness(x, yR0);
      ovctx.fillStyle = v0 < th.th0 ? 'rgba(0,100,255,0.6)' : 'rgba(255,60,60,0.45)';
      ovctx.fillRect(x, yR0 - bandH/2, 3, bandH);
    }
    for (let x = 4; x < W-4; x += 3) {
      const v1 = readBrightness(x, yR1);
      ovctx.fillStyle = v1 < th.th1 ? 'rgba(0,100,255,0.6)' : 'rgba(255,60,60,0.45)';
      ovctx.fillRect(x, yR1 - bandH/2, 3, bandH);
    }
    for (let x = 4; x < W-4; x += 3) {
      const v2 = readBrightness(x, yR2);
      ovctx.fillStyle = v2 < th.th2 ? 'rgba(0,100,255,0.6)' : 'rgba(255,60,60,0.45)';
      ovctx.fillRect(x, yR2 - bandH/2, 3, bandH);
    }

    // Rumene črte – kje bere
    ovctx.strokeStyle = 'rgba(255,255,0,0.9)';
    ovctx.lineWidth = 1;
    ovctx.beginPath();
    ovctx.moveTo(4, yR0); ovctx.lineTo(W-4, yR0);
    ovctx.moveTo(4, yR1); ovctx.lineTo(W-4, yR1);
    ovctx.moveTo(4, yR2); ovctx.lineTo(W-4, yR2);
    ovctx.stroke();
  }

  // Referenčna rdeča črta
  ovctx.fillStyle = 'red';
  ovctx.fillRect(W/2 - lineThick/2, 0, lineThick, H);

  // DEBUG
  if (debugOn && debug) {
    if (debug.gridLines && debug.gridLines.length > 0) {
      ovctx.strokeStyle = 'rgba(0,255,255,0.85)';
      ovctx.lineWidth = 1;
      ovctx.setLineDash([4,4]);
      ovctx.beginPath();
      for (const t of debug.gridLines) {
        ovctx.moveTo(t, 0); ovctx.lineTo(t, H);
      }
      ovctx.stroke(); ovctx.setLineDash([]);
    }
    if (debug.refLeft !== undefined && debug.refRight !== undefined) {
      ovctx.fillStyle = 'yellow';
      ovctx.fillRect(debug.refLeft-1, 0, 3, H);
      ovctx.fillStyle = 'orange';
      ovctx.fillRect(debug.refRight-1, 0, 3, H);
    }
    if (debug.bitPoints) {
      ovctx.lineWidth = Math.max(2, lineThick);
      ovctx.strokeStyle = 'lime';
      for (const p of debug.bitPoints) {
        ovctx.beginPath();
        ovctx.arc(p.x, p.y, 5, 0, Math.PI*2);
        ovctx.stroke();
      }
      ovctx.fillStyle = 'lime';
      ovctx.font = 'bold 10px monospace';
      for (const p of debug.bitPoints) {
        ovctx.fillText('b'+p.bit, p.x+7, p.y-6);
      }
    }
    ovctx.strokeStyle = 'magenta';
    ovctx.lineWidth = Math.max(2, lineThick);
    ovctx.beginPath();
    ovctx.arc(W/2, H/2, 12, 0, Math.PI*2);
    ovctx.stroke();
  }
}

function bitsStr(b) { let s=''; for (let i=7;i>=0;i--) s += (b>>i)&1; return s; }

function update() {
  if (mode === 'sim') {
    const cIn = parseFloat($('coarse').value), fIn = parseFloat($('fine').value);
    const P = Math.max(P_MIN_MM, Math.min(P_MAX_MM, cIn + fIn));
    $('coarseVal').textContent = cIn.toFixed(0)+' mm';
    $('fineVal').textContent = fIn.toFixed(2);
    $('totalVal').textContent = P.toFixed(2)+' mm';
    drawSimulator(P);
    ovctx.drawImage(processC, 0, 0, overlay.width, overlay.height);
    const r = readDynamic(P);
    drawGuidesOnOverlay(r);
    outEl.textContent = r.mm.toFixed(2) + ' mm';
    $('napakaVal').textContent = (r.mm - P).toFixed(2) + ' mm';
    $('deltaVal').textContent = r.delta.toFixed(2) + ' mm';
    $('boundaryWarn').textContent = (r.delta < 0.2 || r.delta > 4.8) ? '⚠ rob' : '';
    $('testOut').textContent =
      'P=' + P.toFixed(2) + '  Pphys=' + (P+CODE_OFFSET).toFixed(2) + '\n' +
      'bits=' + bitsStr(r.bits) + '  cRef=' + r.cRef + '\n' +
      'δ=' + r.delta.toFixed(2) + '  mm=' + r.mm.toFixed(2) +
      '  napaka=' + (r.mm-P).toFixed(2);
  } else if (video.readyState >= 2) {
    snapshotToProcess();
    ovctx.drawImage(processC, 0, 0, overlay.width, overlay.height);

    const r = autoMode ? readFromCamera() : readFromCameraManual();
    drawGuidesOnOverlay(r);

    if (r.ok) {
      outEl.textContent = r.mm.toFixed(2) + ' mm';
      $('deltaVal').textContent = r.delta.toFixed(2) + ' mm';
      $('boundaryWarn').textContent = (r.delta < 0.2 || r.delta > 4.8) ? '⚠ rob' : '';
      $('napakaVal').textContent = '–';
      $('testOut').textContent =
        '=== ' + (autoMode ? 'AVTOMATIKA' : 'ROČNO') + ' ===\n' +
        'detected CLOCK: ' + r.detected + '  trans=' + (r.detectedTrans||'?') + '\n' +
        'yRow0=' + r.yRow0 + '  yRow1=' + r.yRow1 + '  yRow2=' + r.yRow2 + '\n' +
        'rowH=' + r.rowH.toFixed(1) + ' px  cellPx=' + r.cellPx.toFixed(1) + ' px\n' +
        'th0=' + r.thresholds.th0.toFixed(0) +
        '  th1=' + r.thresholds.th1.toFixed(0) +
        '  th2=' + r.thresholds.th2.toFixed(0) + '\n' +
        'prehodi=' + r.transitions.length + '  mreža=' + r.numCells + ' celic\n' +
        'najd.niz=' + r.bestLen + '  cRef=' + r.c + '\n' +
        'bits=' + bitsStr(r.bits) + '\n' +
        'δ=' + r.delta.toFixed(2) + ' mm\n' +
        'mm_phys=' + r.mm_phys.toFixed(2) + '  mm=' + r.mm.toFixed(2);
    } else {
      outEl.textContent = '–';
      $('deltaVal').textContent = '–';
      $('boundaryWarn').textContent = '';
      $('napakaVal').textContent = '–';
      $('testOut').textContent = 'Branje ni uspelo: ' + (r.reason || '') +
        '\ndetected=' + r.detected + '  yRow2=' + r.yRow2;
    }
  }
  requestAnimationFrame(update);
}

function testAdjacent() {
  if (mode !== 'sim') {
    mode='sim'; stopCamera();
    $('toggle').textContent='Na kamero'; statusEl.textContent='Simulator';
  }
  const lines = ['P       preb   cRef δ     niz  okn     nap    OK',
                 '------  -----  ---  ----  ---  ------  -----  ---'];
  let errs = 0;
  for (let mm = 0; mm <= 30; mm += 2.5) {
    drawSimulator(mm);
    const r = readDynamic(mm);
    const err = r.mm - mm;
    const ok = Math.abs(err) < 1;
    if (!ok) errs++;
    lines.push(
      String(mm.toFixed(2)).padStart(6)+'  '+
      String(r.mm.toFixed(2)).padStart(5)+'  '+
      String(r.cRef).padStart(3)+'  '+
      String(r.delta.toFixed(2)).padStart(4)+'  '+
      String(r.bestLen).padStart(3)+'  '+
      String(r.validWindows+'/'+r.numWindows).padStart(6)+'  '+
      String(err.toFixed(2)).padStart(5)+'  '+(ok?'✓':'✗'));
  }
  lines.push(''); lines.push('Napak: '+errs);
  lines.push(errs===0?'VSE OK ✓':'NAPAKE!');
  $('testOut').textContent = lines.join('\n');
}

function exportA4() {
  const DPI = 300, PPMM = DPI/25.4;
  const W_PX = Math.round(297*PPMM), H_PX = Math.round(210*PPMM);
  const cvs = document.createElement('canvas');
  cvs.width = W_PX; cvs.height = H_PX;
  const ctx = cvs.getContext('2d');
  ctx.fillStyle = 'white'; ctx.fillRect(0,0,W_PX,H_PX);
  const M = 10*PPMM, CELL_PX = 5*PPMM;
  const N = 53, stripStarts = [70,335,600,865], top = 14*PPMM;

  ctx.fillStyle = '#222'; ctx.font = `bold ${4*PPMM}px sans-serif`;
  ctx.fillText('Premerka – prikaz 0–1000 mm (koda 100–1100 mm)', M, 6*PPMM);

  stripStarts.forEach((sMM, idx) => {
    const y0 = top + idx*(26+6)*PPMM;
    if (y0 + 26*PPMM > H_PX - M) return;
    const c0 = sMM/5;
    ctx.fillStyle = '#000'; ctx.font = `bold ${3.5*PPMM}px monospace`;
    ctx.fillText(`Trak ${idx+1}:  ${sMM-100} … ${sMM-100+N*5} mm`, M, y0+4*PPMM);
    const yc = y0 + 6*PPMM;
    for (let i = 0; i < N; i++) {
      const col = c0+i, x = M + i*CELL_PX;
      ctx.fillStyle = DB[col & 0xFF] ? 'black' : 'white';
      ctx.fillRect(x, yc, CELL_PX, CELL_PX);
      ctx.fillStyle = DB[(col+4) & 0xFF] ? 'black' : 'white';
      ctx.fillRect(x, yc+CELL_PX, CELL_PX, CELL_PX);
      ctx.fillStyle = (col & 1) ? 'white' : 'black';
      ctx.fillRect(x, yc+2*CELL_PX, CELL_PX, CELL_PX);
    }
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
    ctx.strokeRect(M+0.5, yc+0.5, N*CELL_PX, 3*CELL_PX);
  });

  cvs.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'premerka-A4-'+new Date().toISOString().slice(0,10)+'.jpg';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    statusEl.textContent = 'Izvoženo';
  }, 'image/jpeg', 0.95);
}

async function listCameras() {
  try {
    const tmp = await navigator.mediaDevices.getUserMedia({ video:true });
    tmp.getTracks().forEach(t=>t.stop());
    const devs = await navigator.mediaDevices.enumerateDevices();
    const cams = devs.filter(d => d.kind === 'videoinput');
    const sel = $('camSelect'); sel.innerHTML = '';
    cams.forEach((c,i) => {
      const o = document.createElement('option');
      o.value = c.deviceId;
      o.textContent = c.label || ('Kamera '+(i+1));
      sel.appendChild(o);
    });
    if (cams.length > 0) {
      const pref = cams.find(c => /back|rear|zadnja/i.test(c.label)) || cams[cams.length-1];
      currentDeviceId = pref.deviceId;
      sel.value = currentDeviceId;
    }
    sel.onchange = () => { currentDeviceId = sel.value; restartCamera(); };
  } catch (e) { statusEl.textContent = 'Napaka seznama: '+e.message; }
}
async function startCamera() {
  try {
    const cons = { video: currentDeviceId
      ? { deviceId:{exact:currentDeviceId}, width:{ideal:1920}, height:{ideal:1080} }
      : { facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} }
    };
    stream = await navigator.mediaDevices.getUserMedia(cons);
    video.srcObject = stream; await video.play();
    statusEl.textContent = 'Kamera';
  } catch (e) { statusEl.textContent = 'Napaka: '+e.message; }
}
function stopCamera() { if (stream) { stream.getTracks().forEach(t=>t.stop()); stream=null; } }
async function restartCamera() { stopCamera(); await startCamera(); }

function toggleMode() {
  if (mode === 'camera') {
    mode='sim'; stopCamera(); $('toggle').textContent='Na kamero';
    statusEl.textContent='Simulator';
  } else {
    mode='camera'; $('toggle').textContent='Na simulator'; startCamera();
  }
}
function toggleOrientation() {
  orientation = orientation === 'h' ? 'v' : 'h';
  $('orientBtn').textContent = orientation === 'h' ? 'Vodoravno' : 'Navpično';
  ovctx.clearRect(0,0,overlay.width,overlay.height);
}

function setAuto(on) {
  autoMode = on;
  $('roiSize').disabled = on;
  $('roiOffset').disabled = on;
  $('thSlider').disabled = on;
  statusEl.textContent = on ? 'AVTOMATIKA' : 'ROČNO';
}

overlay.width = 800; overlay.height = 600;
processC.width = 800; processC.height = 600;
video.addEventListener('loadedmetadata', () => {
  const W = video.videoWidth || 800, H = video.videoHeight || 600;
  overlay.width = W; overlay.height = H;
  processC.width = W; processC.height = H;
});

$('toggle').onclick = toggleMode;
$('testBtn').onclick = testAdjacent;
$('exportBtn').onclick = exportA4;
$('orientBtn').onclick = toggleOrientation;
$('roiSize').oninput = e => { roiSize = e.target.value/100; $('roiSizeVal').textContent = e.target.value+' %'; };
$('roiOffset').oninput = e => { roiOffset = e.target.value/100; $('roiOffsetVal').textContent = e.target.value+' %'; };
$('lineThick').oninput = e => { lineThick = parseInt(e.target.value); $('lineThickVal').textContent = lineThick+' px'; };
$('debugChk').onchange = e => { debugOn = e.target.checked; };
$('contrastChk').onchange = e => { contrastOn = e.target.checked; };
$('autoChk').onchange = e => setAuto(e.target.checked);
$('thSlider').oninput = e => { manualTh = parseInt(e.target.value); $('thVal').textContent = manualTh; };
$('thOffset').oninput = e => {
  thOffset = parseInt(e.target.value);
  $('thOffsetVal').textContent = (thOffset > 0 ? '+' : '') + thOffset;
};

setAuto(true);
listCameras().then(() => startCamera().then(() => requestAnimationFrame(update)));
</script>
