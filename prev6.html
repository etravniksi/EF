<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111">
<title>Premerka</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, Roboto, sans-serif;
    background: #111; color: #eee;
    overflow-x: hidden; touch-action: manipulation;
  }
  body { display: flex; flex-direction: column; align-items: center; padding: 8px 4px 20px; }
  .camera-wrap {
    position: relative;
    width: 85vw; max-width: 500px;
    aspect-ratio: 4 / 3;
    background: #000;
    border: 2px solid #333; border-radius: 12px;
    overflow: hidden; margin-bottom: 10px;
  }
  #v { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
  #process { display: none; }
  .controls { width: 100vw; max-width: 640px; display: flex; flex-direction: column; gap: 10px; padding: 0 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button {
    padding: 14px 18px; font-size: clamp(15px, 4vw, 20px);
    border: none; border-radius: 12px;
    background: #4f4; color: #111; font-weight: bold;
    box-shadow: 0 4px 0 #2a2; flex: 1; min-height: 52px; white-space: nowrap;
  }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 #2a2; }
  button.alt { background: #48f; color: #fff; box-shadow: 0 4px 0 #25a; }
  button.export { background: #f90; color: #111; box-shadow: 0 4px 0 #a60; }
  button.small { flex: 0 0 auto; min-width: auto; padding: 10px 16px; font-size: 14px; }
  select {
    flex: 1; min-width: 120px; padding: 12px 14px;
    font-size: 15px; background: #222; color: #eee;
    border: 2px solid #444; border-radius: 10px; -webkit-appearance: none;
  }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    flex: 1; min-width: 100px; height: 60px;
    background: transparent; margin: 0; touch-action: none;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 20px; background: #333; border-radius: 10px; border: 2px solid #555;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 30px; height: 30px; background: #48f; border: 3px solid #fff;
    border-radius: 50%; margin-top: -8px;
  }
  input[type=range]::-moz-range-track { height: 20px; background: #333; border-radius: 10px; border: 2px solid #555; }
  input[type=range]::-moz-range-thumb { width: 30px; height: 30px; background: #48f; border: 3px solid #fff; border-radius: 50%; }
  #rezultat { font-size: clamp(34px, 10vw, 56px); font-weight: bold; color: #4f4; line-height: 1.1; }
  #totalVal, .big { font-size: clamp(26px, 7vw, 44px); font-weight: bold; color: #4f4; }
  .val { font-size: clamp(16px, 4.5vw, 26px); font-weight: bold; color: #4f4; }
  .label { font-size: clamp(14px, 4vw, 20px); color: #bbb; font-weight: bold; min-width: 80px; flex-shrink: 0; }
  #status { font-size: clamp(12px, 3.3vw, 16px); color: #888; margin-left: auto; }
  .warn { color: #fa0; font-weight: bold; font-size: clamp(14px, 4vw, 20px); }
  #testOut {
    font-family: ui-monospace, monospace;
    font-size: clamp(10px, 2.7vw, 13px); color: #8f8;
    white-space: pre; max-height: 40vh; overflow: auto;
    background: #000; padding: 10px; border-radius: 10px;
    line-height: 1.35; width: 100%;
  }
</style>
</head>
<body>

<div class="camera-wrap">
  <video id="v" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>
<canvas id="process"></canvas>

<div class="controls">
  <div class="row">
    <span class="label">Kamera</span>
    <select id="camSelect"></select>
  </div>

  <div class="row">
    <button id="orientBtn" class="small">Vodoravno</button>
    <button id="exportBtn" class="export">Izvozi A4 (JPG)</button>
  </div>

  <div class="row">
    <button id="toggle">Na simulator</button>
    <button id="testBtn" class="alt">Preveri</button>
  </div>

  <!-- NOVA: velikost in pomik območja -->
  <div class="row">
    <span class="label">Velikost</span>
    <input type="range" id="roiSize" min="10" max="80" step="1" value="35">
    <span id="roiSizeVal" class="val">35 %</span>
  </div>
  <div class="row">
    <span class="label">Pomik</span>
    <input type="range" id="roiOffset" min="0" max="100" step="1" value="50">
    <span id="roiOffsetVal" class="val">50 %</span>
  </div>

  <div class="row">
    <span class="label">Grobo</span>
    <input type="range" id="coarse" min="0" max="1000" step="5" value="0">
    <span id="coarseVal" class="val">0 mm</span>
  </div>
  <div class="row">
    <span class="label">Fino</span>
    <input type="range" id="fine" min="-30" max="30" step="0.01" value="0">
    <span id="fineVal" class="val">0.00</span>
  </div>
  <div class="row">
    <span class="label">P</span>
    <span id="totalVal" class="val big">0.00 mm</span>
  </div>
  <div class="row">
    <span class="label">Prebrano</span>
    <span id="rezultat">–</span>
  </div>
  <div class="row">
    <span class="label">Napaka</span>
    <span id="napakaVal" class="val">–</span>
  </div>
  <div class="row">
    <span class="label">δ</span>
    <span id="deltaVal" class="val">–</span>
    <span id="boundaryWarn" class="warn"></span>
  </div>
  <div class="row"><span id="status">Kamera</span></div>
  <div id="testOut"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const CODE_OFFSET = 100;
const P_MIN_MM = 0, P_MAX_MM = 1000;
const DRAW_MIN_MM = 70, DRAW_MAX_MM = 1130;

// ---------- De Bruijn ----------
function deBruijn(k, n) {
  const a = new Array(n + 1).fill(0), seq = [];
  (function db(t, p) {
    if (t > n) { if (n % p === 0) for (let i = 1; i <= p; i++) seq.push(a[i]); }
    else { a[t] = a[t - p]; db(t + 1, p);
      for (let j = a[t - p] + 1; j < k; j++) { a[t] = j; db(t + 1, t); } }
  })(1, 1);
  return seq;
}
const DB = deBruijn(2, 8);
const LOOKUP = new Array(256).fill(-1);
for (let i = 0; i < 256; i++) {
  let w = 0;
  for (let j = 0; j < 8; j++) w |= DB[(i + j) & 0xFF] << j;
  LOOKUP[w] = i;
}

// ---------- Canvas ----------
const video = $('v'), overlay = $('overlay'), ovctx = overlay.getContext('2d');
const processC = $('process'), pctx = processC.getContext('2d', { willReadFrequently: true });
const outEl = $('rezultat'), statusEl = $('status');

const PX_PER_MM = 10, IDEAL_CELL_PX = 50, ROW_PX = 50, Y0 = 50;
const Y_ROW0 = Y0, Y_ROW1 = Y0 + ROW_PX, Y_ROW2 = Y0 + 2 * ROW_PX, Y_END = Y0 + 3 * ROW_PX;
const yC0 = Y_ROW0 + 25, yC1 = Y_ROW1 + 25, yC2 = Y_ROW2 + 25;

let mode = 'camera';
let orientation = 'h';
let stream = null, currentDeviceId = null;

// ROI parametri
let roiSize = 0.35;    // 0.10 – 0.80
let roiOffset = 0.50;  // 0.00 – 1.00

// ---------- Simulator risanje (na process) ----------
function drawSimulator(P) {
  const Pphys = P + CODE_OFFSET;
  const W = processC.width, H = processC.height, cx = W / 2;
  const c0 = Math.floor(Pphys / 5);
  const cMin = Math.floor(DRAW_MIN_MM / 5), cMax = Math.ceil(DRAW_MAX_MM / 5);

  pctx.fillStyle = 'white';
  pctx.fillRect(0, 0, W, H);
  const xOf = col => Math.round(cx + (col * 5 - Pphys) * PX_PER_MM);

  for (let col = c0 - 20; col <= c0 + 24; col++) {
    if (col < cMin || col > cMax) continue;
    const x = xOf(col), w = ROW_PX;
    pctx.fillStyle = DB[col & 0xFF] ? 'black' : 'white';
    pctx.fillRect(x, Y_ROW0, w, ROW_PX);
    pctx.fillStyle = DB[(col + 4) & 0xFF] ? 'black' : 'white';
    pctx.fillRect(x, Y_ROW1, w, ROW_PX);
    pctx.fillStyle = (col & 1) ? 'white' : 'black';
    pctx.fillRect(x, Y_ROW2, w, ROW_PX);
  }
}

// ---------- Vodila na overlay ----------
function drawGuidesOnOverlay() {
  const W = overlay.width, H = overlay.height;
  ovctx.clearRect(0, 0, W, H);
  ovctx.lineWidth = 2;
  ovctx.font = 'bold 11px monospace';

  if (orientation === 'h') {
    const roiH = Math.max(20, H * roiSize);
    const y0 = H * roiOffset - roiH / 2;
    const y1 = y0 + roiH;
    const rowPx = roiH / 3;

    ovctx.fillStyle = 'red';
    ovctx.fillRect(W/2 - 1, 0, 2, y0);
    ovctx.fillRect(W/2 - 1, y1, 2, H - y1);

    ovctx.strokeStyle = 'rgba(255,60,60,0.85)';
    ovctx.strokeRect(8, y0, W - 16, roiH);

    ovctx.setLineDash([6, 4]);
    ovctx.strokeStyle = 'rgba(255,60,60,0.5)';
    ovctx.beginPath();
    ovctx.moveTo(8, y0 + rowPx); ovctx.lineTo(W - 8, y0 + rowPx);
    ovctx.moveTo(8, y0 + 2*rowPx); ovctx.lineTo(W - 8, y0 + 2*rowPx);
    ovctx.stroke();
    ovctx.setLineDash([]);

    ovctx.fillStyle = 'red';
    for (let k = 0; k < 3; k++) {
      const yc = y0 + k * rowPx + rowPx / 2;
      ovctx.beginPath(); ovctx.moveTo(W/2 - 22, yc); ovctx.lineTo(W/2 - 8, yc - 6);
      ovctx.lineTo(W/2 - 8, yc + 6); ovctx.closePath(); ovctx.fill();
      ovctx.beginPath(); ovctx.moveTo(W/2 + 22, yc); ovctx.lineTo(W/2 + 8, yc - 6);
      ovctx.lineTo(W/2 + 8, yc + 6); ovctx.closePath(); ovctx.fill();
    }

    ovctx.fillStyle = 'rgba(80,160,255,0.95)';
    ovctx.fillText('bit0-3', 12, y0 + 12);
    ovctx.fillText('bit4-7', 12, y0 + rowPx + 12);
    ovctx.fillText('CLOCK',  12, y0 + 2*rowPx + 12);

  } else {
    const roiW = Math.max(20, W * roiSize);
    const x0 = W * roiOffset - roiW / 2;
    const x1 = x0 + roiW;
    const colW = roiW / 3;

    ovctx.fillStyle = 'red';
    ovctx.fillRect(0, H/2 - 1, x0, 2);
    ovctx.fillRect(x1, H/2 - 1, W - x1, 2);

    ovctx.strokeStyle = 'rgba(255,60,60,0.85)';
    ovctx.strokeRect(x0, 8, roiW, H - 16);

    ovctx.setLineDash([6, 4]);
    ovctx.strokeStyle = 'rgba(255,60,60,0.5)';
    ovctx.beginPath();
    ovctx.moveTo(x0 + colW, 8); ovctx.lineTo(x0 + colW, H - 8);
    ovctx.moveTo(x0 + 2*colW, 8); ovctx.lineTo(x0 + 2*colW, H - 8);
    ovctx.stroke();
    ovctx.setLineDash([]);

    ovctx.fillStyle = 'red';
    for (let k = 0; k < 3; k++) {
      const xc = x0 + k * colW + colW / 2;
      ovctx.beginPath(); ovctx.moveTo(xc, H/2 - 22); ovctx.lineTo(xc - 6, H/2 - 8);
      ovctx.lineTo(xc + 6, H/2 - 8); ovctx.closePath(); ovctx.fill();
      ovctx.beginPath(); ovctx.moveTo(xc, H/2 + 22); ovctx.lineTo(xc - 6, H/2 + 8);
      ovctx.lineTo(xc + 6, H/2 + 8); ovctx.closePath(); ovctx.fill();
    }

    ovctx.fillStyle = 'rgba(80,160,255,0.95)';
    ovctx.fillText('b0-3',  x0 + 4, 20);
    ovctx.fillText('b4-7',  x0 + colW + 4, 20);
    ovctx.fillText('CLK',   x0 + 2*colW + 4, 20);
  }
}

// ---------- Branje piksla iz process canvasa ----------
function readPixel(x, y) {
  const xi = Math.round(x), yi = Math.round(y);
  if (xi < 0 || yi < 0 || xi >= processC.width || yi >= processC.height) return 1;
  const d = pctx.getImageData(xi, yi, 1, 1).data;
  return ((d[0] + d[1] + d[2]) / 3) < 128 ? 1 : 0;
}

// ---------- Simulator branje ----------
function readBitSim(yc, xCenter) {
  let s = 0, n = 0;
  for (const dx of [-8,-4,4,8]) { s += readPixel(xCenter + dx, yc); n++; }
  return s > n/2 ? 1 : 0;
}
function readWindowAt(Pphys, cStart) {
  const cx = processC.width/2; let bits = 0;
  for (let i = 0; i < 4; i++) {
    const xc = cx + ((cStart + i) * 5 + 2.5 - Pphys) * PX_PER_MM;
    bits |= readBitSim(yC0, xc) << i;
    bits |= readBitSim(yC1, xc) << (4 + i);
  }
  return { bits, c: LOOKUP[bits] };
}
function findCellEdges(xC, yc) {
  const col = readPixel(xC, yc);
  let L = null, R = null;
  for (let d = 1; d < 80; d++) if (readPixel(xC - d, yc) !== col) { L = xC - d + 0.5; break; }
  for (let d = 1; d < 80; d++) if (readPixel(xC + d, yc) !== col) { R = xC + d - 0.5; break; }
  return { L, R };
}
function readDynamic(P) {
  const Pphys = P + CODE_OFFSET;
  const cx = processC.width/2, CELL = 50;
  const N = Math.min(Math.floor((processC.width - 100)/50), 15);
  const halfN = Math.floor(N/2);
  const cApprox = Math.floor(Pphys / 5);
  const wins = [];
  for (let k = 0; k < N-3; k++) {
    const cs = cApprox - halfN + k;
    wins.push({ k, cs, ...readWindowAt(Pphys, cs) });
  }
  let bestS = 0, bestL = 0, curS = 0;
  for (let k = 0; k < wins.length; k++) {
    const prev = wins[k-1], w = wins[k];
    const cons = k > 0 && prev.c >= 0 && w.c >= 0 && ((w.c - prev.c + 256) % 256 === 1);
    if (!cons) { if (k - curS > bestL) { bestL = k - curS; bestS = curS; } curS = k; }
  }
  if (wins.length - curS > bestL) { bestL = wins.length - curS; bestS = curS; }
  const targetK = halfN - 2;
  let chosen = null, bd = Infinity;
  if (bestL >= 3) for (let k = bestS; k < bestS + bestL; k++) {
    if (wins[k].c < 0) continue;
    const d = Math.abs(k - targetK);
    if (d < bd) { bd = d; chosen = wins[k]; }
  }
  if (!chosen) for (const w of wins) {
    if (w.c < 0) continue;
    const d = Math.abs(w.k - targetK);
    if (d < bd) { bd = d; chosen = w; }
  }
  if (!chosen) chosen = { k: targetK, cs: cApprox, c: cApprox, bits: 0 };
  const cStart = chosen.c;
  const offset = Math.max(0, Math.min(7, cApprox - cStart));
  const cRef = cStart + offset;
  const xc = cx + (cRef*5 + 2.5 - Pphys) * PX_PER_MM;
  const e = findCellEdges(xc, yC2);
  let delta = 0, w = null, cal = 1;
  if (e.L !== null && e.R !== null) {
    w = e.R - e.L; cal = w / IDEAL_CELL_PX;
    delta = Math.max(0, Math.min(5, (cx - e.L) / w * 5));
  }
  const mm_phys = cRef*5 + delta, mm = mm_phys - CODE_OFFSET;
  return { c: cRef, cStart, cRef, offset, bits: chosen.bits,
    cApprox, chosenK: chosen.k, bestLen: bestL, bestStart: bestS,
    numWindows: wins.length, validWindows: wins.filter(x=>x.c>=0).length,
    allC: wins.map(x=>x.c), delta, widthPx: w, calFactor: cal, mm, mm_phys };
}

// ---------- Snemanje videa v process ----------
function snapshotToProcess() {
  if (video.readyState < 2) return;
  const W = processC.width, H = processC.height;
  pctx.save();
  if (orientation === 'h') {
    pctx.drawImage(video, 0, 0, W, H);
  } else {
    // Rotiraj 90° CW, da dobimo vodoravno postavitev
    pctx.translate(W/2, H/2);
    pctx.rotate(Math.PI / 2);
    const ratio = video.videoWidth / video.videoHeight;
    // Po rotaciji: širina = H, višina = W; poravnaj da zapolni
    let dw = H, dh = H / ratio;
    if (dh < W) { dh = W; dw = W * ratio; }
    pctx.drawImage(video, -dw/2, -dh/2, dw, dh);
  }
  pctx.restore();
}

// ---------- Branje iz kamere ----------
function readFromCamera() {
  const W = processC.width, H = processC.height, cx = Math.floor(W/2);

  const roiPx = Math.max(20, (orientation === 'h' ? H : W) * roiSize);
  let y0, rowPx;
  if (orientation === 'h') {
    y0 = H * roiOffset - roiPx / 2;
    rowPx = roiPx / 3;
  } else {
    // V navpičnem načinu smo sliko rotirali, zato je ROI enak kot vodoravno
    y0 = H * 0.5 - roiPx / 2;
    rowPx = roiPx / 3;
  }

  const yRow0 = Math.round(y0 + rowPx * 0.5);
  const yRow1 = Math.round(y0 + rowPx * 1.5);
  const yRow2 = Math.round(y0 + rowPx * 2.5);

  // Prehodi v CLOCK vrstici
  const trans = [];
  let prev = readPixel(4, yRow2);
  for (let x = 5; x < W - 4; x++) {
    const v = readPixel(x, yRow2);
    if (v !== prev) trans.push(x);
    prev = v;
  }
  if (trans.length < 4) return { ok:false, reason:'Premalo prehodov ('+trans.length+')' };

  let sumG = 0, nG = 0;
  for (let i = 1; i < trans.length; i++) {
    const g = trans[i] - trans[i-1];
    if (g > 3 && g < 300) { sumG += g; nG++; }
  }
  if (nG < 2) return { ok:false, reason:'Premalo veljavnih celic' };
  const cellPx = sumG / nG;

  // Levi rob celice, ki vsebuje cx
  let L = null, R = null;
  for (const t of trans) { if (t <= cx) L = t; if (t > cx && R === null) R = t; }
  if (L === null) L = cx - cellPx / 2;
  if (R === null) R = L + cellPx;
  const cellW = R - L;

  // Preberi 8 bitov
  let bits = 0;
  for (let i = 0; i < 4; i++) {
    const xc = Math.round(L + (i + 0.5) * cellPx);
    bits |= readPixel(xc, yRow0) << i;
    bits |= readPixel(xc, yRow1) << (4 + i);
  }
  let c = LOOKUP[bits];
  if (c < 0) {
    for (const shift of [-1, 1, -2, 2]) {
      let b2 = 0;
      for (let i = 0; i < 4; i++) {
        const xc = Math.round(L + (i + 0.5 + shift) * cellPx);
        b2 |= readPixel(xc, yRow0) << i;
        b2 |= readPixel(xc, yRow1) << (4 + i);
      }
      const c2 = LOOKUP[b2];
      if (c2 >= 0) { bits = b2; c = c2; break; }
    }
  }
  if (c < 0) c = 0;

  let delta = (cx - L) / cellW * 5;
  delta = Math.max(0, Math.min(5, delta));
  const mm_phys = c * 5 + delta;
  const mm = Math.max(0, Math.min(1000, mm_phys - CODE_OFFSET));

  return { ok:true, mm, mm_phys, c, delta, cellPx, cellW, bits, trans: trans.length };
}

// ---------- Zanka ----------
function bitsStr(b) { let s=''; for (let i=7;i>=0;i--) s += (b>>i)&1; return s; }

function update() {
  if (mode === 'sim') {
    const cIn = parseFloat($('coarse').value), fIn = parseFloat($('fine').value);
    const P = Math.max(P_MIN_MM, Math.min(P_MAX_MM, cIn + fIn));
    $('coarseVal').textContent = cIn.toFixed(0) + ' mm';
    $('fineVal').textContent = fIn.toFixed(2);
    $('totalVal').textContent = P.toFixed(2) + ' mm';

    drawSimulator(P);
    ovctx.drawImage(processC, 0, 0, overlay.width, overlay.height);
    drawGuidesOnOverlay();

    const r = readDynamic(P);
    outEl.textContent = r.mm.toFixed(2) + ' mm';
    $('napakaVal').textContent = (r.mm - P).toFixed(2) + ' mm';
    $('deltaVal').textContent = r.delta.toFixed(2) + ' mm';
    $('boundaryWarn').textContent = (r.delta < 0.2 || r.delta > 4.8) ? '⚠ rob' : '';

    $('testOut').textContent =
      'P              = ' + P.toFixed(2) + ' mm  →  Pphys = ' + (P+CODE_OFFSET).toFixed(2) + '\n' +
      'bits           = ' + bitsStr(r.bits) + '  (cStart=' + r.cStart + ')\n' +
      'Okna           = ' + r.numWindows + '  (veljavnih: ' + r.validWindows + ')\n' +
      'Najdaljši niz  = ' + r.bestLen + '\n' +
      'cStart         = ' + r.cStart + '  cApprox = ' + r.cApprox + '  offset = ' + r.offset + '\n' +
      'cRef           = ' + r.cRef + '\n' +
      'kandidati      = ' + r.allC.join(' ') + '\n' +
      'δ              = ' + r.delta.toFixed(2) + ' mm\n' +
      'mm_phys        = ' + r.mm_phys.toFixed(2) + ' mm\n' +
      'mm (prikaz)    = ' + r.mm.toFixed(2) + ' mm\n' +
      'napaka         = ' + (r.mm - P).toFixed(2) + ' mm';
  } else if (video.readyState >= 2) {
    snapshotToProcess();
    ovctx.drawImage(processC, 0, 0, overlay.width, overlay.height);
    drawGuidesOnOverlay();

    const r = readFromCamera();
    if (r.ok) {
      outEl.textContent = r.mm.toFixed(2) + ' mm';
      $('deltaVal').textContent = r.delta.toFixed(2) + ' mm';
      $('boundaryWarn').textContent = (r.delta < 0.2 || r.delta > 4.8) ? '⚠ rob' : '';
      $('testOut').textContent =
        'orientacija = ' + (orientation === 'h' ? 'vodoravno' : 'navpično') + '\n' +
        'ROI = ' + (roiSize*100).toFixed(0) + ' %  pomik = ' + (roiOffset*100).toFixed(0) + ' %\n' +
        'c=' + r.c + '  bits=' + bitsStr(r.bits) + '\n' +
        'cellPx=' + r.cellPx.toFixed(1) + '  prehodi=' + r.trans + '\n' +
        'δ=' + r.delta.toFixed(2) + ' mm\n' +
        'mm_phys=' + r.mm_phys.toFixed(2) + '  mm=' + r.mm.toFixed(2);
    } else {
      outEl.textContent = '–';
      $('deltaVal').textContent = '–';
      $('boundaryWarn').textContent = '';
      $('testOut').textContent = 'Branje ni uspelo: ' + (r.reason || '');
    }
    $('napakaVal').textContent = '–';
  }
  requestAnimationFrame(update);
}

// ---------- Ostalo ----------
function testAdjacent() {
  if (mode !== 'sim') { mode='sim'; stopCamera(); $('toggle').textContent='Na kamero'; statusEl.textContent='Simulator'; }
  const lines = ['P       preb   cRef cSt  δ     niz  okn     nap    OK',
                 '------  -----  ---  ---  ----  ---  ------  -----  ---'];
  let errs = 0;
  for (let mm = 0; mm <= 30; mm += 2.5) {
    drawSimulator(mm);
    const r = readDynamic(mm);
    const err = r.mm - mm;
    const ok = Math.abs(err) < 1;
    if (!ok) errs++;
    lines.push(
      String(mm.toFixed(2)).padStart(6) + '  ' + String(r.mm.toFixed(2)).padStart(5) + '  ' +
      String(r.cRef).padStart(3) + '  ' + String(r.cStart).padStart(3) + '  ' +
      String(r.delta.toFixed(2)).padStart(4) + '  ' + String(r.bestLen).padStart(3) + '  ' +
      String(r.validWindows + '/' + r.numWindows).padStart(6) + '  ' +
      String(err.toFixed(2)).padStart(5) + '  ' + (ok ? '✓' : '✗'));
  }
  lines.push(''); lines.push('Napak: ' + errs); lines.push(errs === 0 ? 'VSE OK ✓' : 'NAPAKE!');
  $('testOut').textContent = lines.join('\n');
}

function exportA4() {
  const DPI = 300, PPMM = DPI/25.4;
  const W_PX = Math.round(297*PPMM), H_PX = Math.round(210*PPMM);
  const cvs = document.createElement('canvas');
  cvs.width = W_PX; cvs.height = H_PX;
  const ctx = cvs.getContext('2d');
  ctx.fillStyle = 'white'; ctx.fillRect(0, 0, W_PX, H_PX);
  const M = 10*PPMM, CELL_PX = 5*PPMM, ROW_PX = 3*CELL_PX;
  const N = 53, stripStarts = [70, 335, 600, 865], top = 14*PPMM;

  ctx.fillStyle = '#222'; ctx.font = `bold ${4*PPMM}px sans-serif`;
  ctx.fillText('Premerka – De Bruijn + CLOCK · prikaz 0–1000 mm', M, 6*PPMM);

  stripStarts.forEach((sMM, idx) => {
    const y0 = top + idx * (26+6) * PPMM;
    if (y0 + 26*PPMM > H_PX - M) return;
    const c0 = sMM / 5;
    ctx.fillStyle = '#000'; ctx.font = `bold ${3.5*PPMM}px monospace`;
    ctx.fillText(`Trak ${idx+1}:  ${sMM-100} … ${sMM-100+N*5} mm  (c = ${c0} … ${c0+N})`,
                 M, y0 + 4*PPMM);
    const yc = y0 + 6*PPMM;
    for (let i = 0; i < N; i++) {
      const col = c0 + i, x = M + i*CELL_PX;
      ctx.fillStyle = DB[col & 0xFF] ? 'black' : 'white'; ctx.fillRect(x, yc, CELL_PX, CELL_PX);
      ctx.fillStyle = DB[(col+4) & 0xFF] ? 'black' : 'white'; ctx.fillRect(x, yc+CELL_PX, CELL_PX, CELL_PX);
      ctx.fillStyle = (col & 1) ? 'white' : 'black'; ctx.fillRect(x, yc+2*CELL_PX, CELL_PX, CELL_PX);
    }
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
    ctx.strokeRect(M + 0.5, yc + 0.5, N*CELL_PX, 3*CELL_PX);
  });

  cvs.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'premerka-A4-' + new Date().toISOString().slice(0,10) + '.jpg';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    statusEl.textContent = 'Izvoženo';
  }, 'image/jpeg', 0.95);
}

async function listCameras() {
  try {
    const tmp = await navigator.mediaDevices.getUserMedia({ video: true });
    tmp.getTracks().forEach(t => t.stop());
    const devs = await navigator.mediaDevices.enumerateDevices();
    const cams = devs.filter(d => d.kind === 'videoinput');
    const sel = $('camSelect'); sel.innerHTML = '';
    cams.forEach((c, i) => {
      const o = document.createElement('option');
      o.value = c.deviceId;
      o.textContent = c.label || ('Kamera ' + (i+1));
      sel.appendChild(o);
    });
    if (cams.length > 0) {
      let pref = cams.find(c => /back|rear|zadnja/i.test(c.label)) || cams[cams.length-1];
      currentDeviceId = pref.deviceId;
      sel.value = currentDeviceId;
    }
    sel.onchange = () => { currentDeviceId = sel.value; restartCamera(); };
  } catch (e) { statusEl.textContent = 'Napaka seznama kamer: ' + e.message; }
}

async function startCamera() {
  try {
    const cons = { video: currentDeviceId
      ? { deviceId: { exact: currentDeviceId }, width:{ideal:1920}, height:{ideal:1080} }
      : { facingMode: { ideal: 'environment' }, width:{ideal:1920}, height:{ideal:1080} }
    };
    stream = await navigator.mediaDevices.getUserMedia(cons);
    video.srcObject = stream; await video.play();
    statusEl.textContent = 'Kamera';
  } catch (e) { statusEl.textContent = 'Napaka: ' + e.message; }
}
function stopCamera() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }
async function restartCamera() { stopCamera(); await startCamera(); }

function toggleMode() {
  if (mode === 'camera') {
    mode = 'sim'; stopCamera(); $('toggle').textContent = 'Na kamero';
    statusEl.textContent = 'Simulator';
  } else {
    mode = 'camera'; $('toggle').textContent = 'Na simulator'; startCamera();
  }
}
function toggleOrientation() {
  orientation = orientation === 'h' ? 'v' : 'h';
  $('orientBtn').textContent = orientation === 'h' ? 'Vodoravno' : 'Navpično';
  ovctx.clearRect(0, 0, overlay.width, overlay.height);
  drawGuidesOnOverlay();
}

// Init
overlay.width = 800; overlay.height = 600;
processC.width = 800; processC.height = 600;
video.addEventListener('loadedmetadata', () => {
  const W = video.videoWidth || 800, H = video.videoHeight || 600;
  overlay.width = W; overlay.height = H;
  processC.width = W; processC.height = H;
});

$('toggle').onclick = toggleMode;
$('testBtn').onclick = testAdjacent;
$('exportBtn').onclick = exportA4;
$('orientBtn').onclick = toggleOrientation;
$('roiSize').oninput = e => { roiSize = e.target.value / 100; $('roiSizeVal').textContent = e.target.value + ' %'; };
$('roiOffset').oninput = e => { roiOffset = e.target.value / 100; $('roiOffsetVal').textContent = e.target.value + ' %'; };

listCameras().then(() => startCamera().then(() => requestAnimationFrame(update)));
</script>
